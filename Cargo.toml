[package]
name = "near-intents-indexer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[[bin]]
name = "near-intents-indexer"
path = "src/main.rs"

[dependencies]
clickhouse = { version = "0.13.2", features = ["rustls-tls"] }
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4"] }
rust_decimal = { version = "1.36.0", features = ["db-tokio-postgres"] }
deadpool-postgres = "0.14.1"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
] }
serde = "1.0.106"
serde_json = "1.0.55"
futures = "0.3.5"
tokio = { version = "1.1", features = [
    "sync",
    "time",
    "rt-multi-thread",
    "macros",
    "signal",
] }
tokio-stream = { version = "0.1" }
tokio-util = { version = "0.7.15", features = ["rt"] }
tracing = "0.1.13"
tracing-subscriber = "0.2.4"
near-lake-framework = "0.7.12"
anyhow = "1.0.51"
regex = "1.5.4"
cached = "0.55.1"
redis = { version = "0.29.5", features = ["tokio-comp"] }
rand = "0.8.5"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.88"
clap = { version = "4.5.41", features = ["derive"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["yaml", "env"] }
humantime-serde = "1.1.1"
axum = "0.8.4"
tower-http = { version = "0.6.6", features = ["cors"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
governor = "0.10.0"

[dev-dependencies]
tokio = { version = "1.1", features = [
    "sync",
    "time",
    "macros",
    "rt-multi-thread",
    "full",
    "test-util",
] }
serde = { version = "1.0.106", features = ["derive"] }
clickhouse = { version = "0.13.2", features = ["test-util"] }
