  redis:
    image: redis:7.4-alpine
    container_name: near-indexer-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - indexer-network

  postgres:
    image: postgres:17.5-alpine
    container_name: near-indexer-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mainnet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mainnet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - indexer-network

volumes:
#  clickhouse_data:
#  clickhouse_logs:
  redis_data:
  postgres_data:

networks:
  indexer-network:
    driver: bridge 
